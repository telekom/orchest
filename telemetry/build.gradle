apply plugin: 'java-library'
apply plugin: 'io.spring.dependency-management'


dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

mavenPublish(project)

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    api "org.springframework.boot:spring-boot-starter-mail:${springBootVersion}"
}

configurations.testRuntimeClasspath {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.platform') {
            details.useVersion '6.0.1'
            details.because 'align junit-platform-launcher with junit-platform-engine from Spring Boot BOM'
        }
    }
}

