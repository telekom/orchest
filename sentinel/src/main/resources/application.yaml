spring:
  application:
    name: sentinel
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
server:
  port: 6100
  shutdown: graceful

management:
  endpoint:
    prometheus:
      access: unrestricted
    health:
      probes:
        enabled: true
      show-details: always
      show-components: always
    metrics:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,env,loggers,ping
  info:
    git:
      mode: full
      enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        all: true
        http:
          server:
            requests: true
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: 1.0

orchest:
  mongo:
    uri: ${ORCHEST_MONGO_URI:mongodb://localhost:27017}
    database-name: ${ORCHEST_MONGO_DATABASE_NAME:orchest}
    auto-index-creation: false
  kafka:
    config:
      bootstrap-servers: ${ORCHEST_KAFKA_CONFIG_BOOTSTRAP_SERVERS:localhost:9092}
    suffix: ${ORCHEST_KAFKA_SUFFIX:}
  metrics:
    # Sentinel only runs housekeeping; lifetime counters are owned by the engine.
    enabled: false
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    # Sentinel runs the dispatcher; producer-only services (orchest-engine, orchest-rest) leave this false.
    dispatcher-enabled: ${SCHEDULER_DISPATCHER_ENABLED:true}
    poll-interval: ${SCHEDULER_POLL_INTERVAL:PT1S}
    batch-size: ${SCHEDULER_BATCH_SIZE:50}
    lease-duration: ${SCHEDULER_LEASE_DURATION:PT60S}
    dispatcher-threads: ${SCHEDULER_DISPATCHER_THREADS:8}
    default-max-attempts: ${SCHEDULER_DEFAULT_MAX_ATTEMPTS:5}
    backoff-base: ${SCHEDULER_BACKOFF_BASE:PT5S}
    backoff-max: ${SCHEDULER_BACKOFF_MAX:PT15M}

kms:
  clients:
    kafka:
      enabled: ${ENABLE_KMS:false}
      kmsKeyARN: ${KAFKA_KMS_KEY_ARN:}
      aws:
        iamRoleARN: ${IAM_ROLE_ARN:}
      dataKeyCaching:
        capacity: 200
        max-usage-limit: 1000
        max-age: 60000
    mongo-read:
      enabled: ${ENABLE_KMS:false}
      kmsKeyARN: ${MONGO_KMS_KEY_ARN:}
      aws:
        iamRoleARN: ${IAM_ROLE_ARN:}
      dataKeyCaching:
        capacity: ${DEK_CACHE_SIZE:100}
        max-usage-limit: 100000000
        max-age: 604800
    mongo-write:
      enabled: ${ENABLE_KMS:false}
      kmsKeyARN: ${MONGO_KMS_KEY_ARN:}
      aws:
        iamRoleARN: ${IAM_ROLE_ARN:}
      dataKeyCaching:
        capacity: ${DEK_CACHE_SIZE:100}
        max-usage-limit: 100000000
        max-age: 604800

telemetry:
  enabled: true

alerting:
  enabled: ${ALERTING_ENABLED:false}
  default-resend-interval-ms: ${ALERTING_INTERVAL:300000}
  # Enable the alert re-notify poller on only one deployment to avoid duplicate emails.
  scheduler:
    enabled: ${TELEMETRY_ALERTING_SCHEDULER_ENABLED:true}
    poll-interval-ms: 10_000
  configs:
    ms-teams:
      enabled: true
      host: ${TEAMS_WEBHOOK_URL:http:localhost:8080}
    email:
      enabled: true
      host: ${ALERTING_CONFIGS_EMAIL_HOST:localhost:25}
      port: 25

logging:
  format: ${LOGGING_FORMAT:PLAIN}
