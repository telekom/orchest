apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'

buildJibImage(project, "io.telekom.orchest.SentinelApplication")

dependencies {
    // Spring Boot dependencies
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Depend on engine-core
    implementation project(':engine-core')
    implementation project(':kafka-event-adapter')
    implementation project(':mongo-data-adapter')
    implementation project(':telemetry')
    implementation project(':alerting')
    implementation project(':logging-template')

    // Development tools
//    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// Spring Boot BOM manages junit-platform-engine to 6.0.1 but the root build.gradle pins
// junit-platform-launcher to 1.11.0. Force all JUnit platform artifacts to 6.0.1 to align.
configurations.testRuntimeClasspath {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.platform') {
            details.useVersion '6.0.1'
            details.because 'align junit-platform-launcher with junit-platform-engine from Spring Boot BOM'
        }
    }
}

