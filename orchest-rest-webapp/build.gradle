apply plugin: 'java-library'
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

mavenPublish(project)

dependencies {
    // Spring Boot – reactive web stack
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-validation'

    // Security – reactive OAuth2 resource server
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // OpenAPI / Swagger – WebFlux variant
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.0.0'

    // dependent modules
    api project(':engine-core')
    api project(':mongo-data-adapter')
    api project(':kafka-event-adapter')
    api project(':telemetry')
    api project(':orchest-ai')
    api project(':entity-caching')
    api project(':alerting')
    api project(':logging-template')

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

// Spring Boot BOM manages junit-platform-engine to 6.0.1 but the root build.gradle pins
// junit-platform-launcher to 1.11.0. Force all JUnit platform artifacts to 6.0.1 to align.
configurations.testRuntimeClasspath {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.platform') {
            details.useVersion '6.0.1'
            details.because 'align junit-platform-launcher with junit-platform-engine from Spring Boot BOM'
        }
    }
}

// Web *APITest classes use Testcontainers (MongoDB + Kafka) and require a working Docker daemon.
// Run them with: ./gradlew :orchest-rest:test -PrunDockerITs   (or ./gradlew build -PrunDockerITs)
tasks.named('test', Test).configure {
    if (!project.hasProperty('runDockerITs')) {
        filter {
            excludeTestsMatching 'io.telekom.orchest.orchestrest.web.DecisionDefinitionAPITest'
            excludeTestsMatching 'io.telekom.orchest.orchestrest.web.DecisionInstanceAPITest'
            excludeTestsMatching 'io.telekom.orchest.orchestrest.web.ProcessDefinitionAPITest'
            excludeTestsMatching 'io.telekom.orchest.orchestrest.web.ProcessInstanceAPITest'
            excludeTestsMatching 'io.telekom.orchest.orchestrest.web.UserTaskAPITest'
            excludeTestsMatching 'io.telekom.orchest.orchestrest.web.VariablesAPITest'
        }
    }
}

