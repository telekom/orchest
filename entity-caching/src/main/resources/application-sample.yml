# Example host-application configuration for the caching-entity starter.
#
# Every key under `telekom.cache.caches.<name>` is an OPTIONAL override for the
# programmatically-registered CacheDefinition with the same `name`. If a key is
# omitted the value baked into the CacheDefinition builder wins — ops can tune
# refresh cadence without a code deploy.

orchest:
  caching:
    enabled: true            # master kill switch (default: true)
    scheduler-pool-size: 2   # threads in the shared refresh scheduler
    caches:
      customerCache:
        enabled: true
        refresh-interval: PT2M     # override: refresh every 2 minutes
        initial-delay: PT5S
        load-on-startup: false
        fail-safe: true            # retain previous snapshot on refresh error
        retry-attempts: 2
        retry-backoff: PT500MS
      productCache:
        enabled: false             # disable this cache in this environment
