components:
  schemas:
    RateLimit:
      type: object
      properties:
        id:
          type: string
        enabled:
          type: boolean
        processId:
          type: string
        windowDuration:
          type: integer
          format: int32
        allowedSize:
          type: integer
          format: int32
        switchToNewCamunda:
          type: boolean
    ProcessState:
      type: object
      properties:
        id:
          type: string
        processId:
          type: string
        status:
          type: boolean
    VariablesRequest:
      type: object
      properties:
        action:
          type: string
          enum:
            - ADD
            - UPDATE
            - DELETE
        processInstanceId:
          type: string
        variables:
          type: object
          additionalProperties: {}
    Meta:
      type: object
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
    ResponseDTOVariablesResponse:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/VariablesResponse'
    VariablesResponse:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: {}
    ResponseDTOUserTaskDTO:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/Meta'
        data:
          $ref: '#/components/schemas/UserTaskDTO'
    UserTaskDTO:
      type: object
      properties:
        taskId:
          type: string
        processInstanceId:
          type: string
        processDefinitionId:
          type: string
        activityId:
          type: string
        taskName:
          type: string
        state:
          type: string
        assignee:
          type: string
        candidateUsers:
          type: array
          items:
            type: string
        candidateGroups:
          type: array
          items:
            type: string
        claimedBy:
          type: string
        dueDate:
          type: string
        followUpDate:
          type: string
        formKey:
          type: string
        variables:
          type: object
          additionalProperties: {}
        createdAt:
          type: string
        claimedAt:
          type: string
        completedAt:
          type: string
    CompleteUserTaskRequest:
      type: object
      properties:
        variables:
          type: object
          additionalProperties: {}
    RetryProcessEvent:
      type: object
      properties:
        processInstanceId:
          type: string
        activityId:
          type: string
        previousActivityId:
          type: string
    BatchInstanceRequest:
      type: object
      properties:
        processInstanceIds:
          type: array
          items:
            type: string
    ActivityNode:
      allOf:
        - $ref: '#/components/schemas/BaseNode'
        - type: object
          properties:
            boundaryEventIds:
              type: array
              items:
                type: string
            multiInstanceLoopCharacteristics:
              $ref: '#/components/schemas/MultiInstanceLoopCharacteristics'
    BaseNode:
      type: object
      discriminator:
        propertyName: '@class'
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - START_EVENT
            - END_EVENT
            - TASK
            - USER_TASK
            - SERVICE_TASK
            - RECEIVE_TASK
            - SEND_TASK
            - BUSINESS_RULE_TASK
            - SCRIPT_TASK
            - MANUAL_TASK
            - SUB_PROCESS
            - CALL_ACTIVITY
            - EXCLUSIVE_GATEWAY
            - PARALLEL_GATEWAY
            - INCLUSIVE_GATEWAY
            - EVENT_BASED_GATEWAY
            - BOUNDARY_EVENT
            - INTERMEDIATE_CATCH_EVENT
            - INTERMEDIATE_THROW_EVENT
        scopeId:
          type: string
        scopeType:
          type: string
          enum:
            - PROCESS
            - SUBPROCESS
            - EVENT_SUBPROCESS
        outgoingSequenceFlowIds:
          type: object
          additionalProperties:
            type: string
        incomingSequenceFlowIds:
          type: object
          additionalProperties:
            type: string
        inputMappings:
          type: array
          items:
            $ref: '#/components/schemas/DataMapping'
        outputMappings:
          type: array
          items:
            $ref: '#/components/schemas/DataMapping'
        properties:
          type: object
          additionalProperties: {}
        '@class':
          type: string
      required:
        - '@class'
    BusinessRuleTaskNode:
      allOf:
        - $ref: '#/components/schemas/BaseNode'
        - type: object
          properties:
            boundaryEventIds:
              type: array
              items:
                type: string
            multiInstanceLoopCharacteristics:
              $ref: '#/components/schemas/MultiInstanceLoopCharacteristics'
            decisionId:
              type: string
            resultVariable:
              type: string
    CallActivityNode:
      allOf:
        - $ref: '#/components/schemas/BaseNode'
        - type: object
          properties:
            boundaryEventIds:
              type: array
              items:
                type: string
            multiInstanceLoopCharacteristics:
              $ref: '#/components/schemas/MultiInstanceLoopCharacteristics'
            calledProcessId:
              type: string
            propagateAllParentVariables:
              type: boolean
            propagateAllChildVariables:
              type: boolean
    DataMapping:
      type: object
      properties:
        name:
          type: string
        value:
          type: string
    EventNode:
      allOf:
        - $ref: '#/components/schemas/BaseNode'
        - type: object
          properties:
            eventType:
              type: string
              enum:
                - NONE
                - TIMER
                - MESSAGE
                - SIGNAL
                - ERROR
                - ESCALATION
                - CONDITIONAL
                - COMPENSATION
                - LINK
                - TERMINATE
                - MULTIPLE
                - PARALLEL_MULTIPLE
                - CANCEL
            attachedToId:
              type: string
            messageName:
              type: string
            messageCorrelationKey:
              type: string
            signalRef:
              type: string
            timerDuration:
              type: string
            timerDate:
              type: string
            timerCycle:
              type: string
            errorRef:
              type: string
            errorCode:
              type: string
            escalationRef:
              type: string
            escalationCode:
              type: string
            condition:
              type: string
            linkName:
              type: string
            zeebeCorrelationKey:
              type: string
            cancelActivity:
              type: boolean
    GatewayNode:
      allOf:
        - $ref: '#/components/schemas/BaseNode'
        - type: object
          properties:
            conditionExpressions:
              type: object
              additionalProperties:
                type: string
            defaultNode:
              type: string
            conditions:
              type: object
              additionalProperties:
                type: string
    ManualTaskNode:
      allOf:
        - $ref: '#/components/schemas/BaseNode'
        - type: object
          properties:
            boundaryEventIds:
              type: array
              items:
                type: string
            multiInstanceLoopCharacteristics:
              $ref: '#/components/schemas/MultiInstanceLoopCharacteristics'
    MultiInstanceLoopCharacteristics:
      type: object
      properties:
        collection:
          type: string
        elementVariable:
          type: string
        completionCondition:
          type: string
        outputCollection:
          type: string
        outputElement:
          type: string
        sequential:
          type: boolean
    ProcessInvocationRequest:
      type: object
      properties:
        processDefinitionId:
          type: string
        processInstanceId:
          type: string
        version:
          type: integer
          format: int32
        variables:
          type: object
          additionalProperties: {}
        parentProcessInstanceId:
          type: string
        nodeInformation:
          oneOf:
            - $ref: '#/components/schemas/ActivityNode'
            - $ref: '#/components/schemas/BusinessRuleTaskNode'
            - $ref: '#/components/schemas/CallActivityNode'
            - $ref: '#/components/schemas/EventNode'
            - $ref: '#/components/schemas/GatewayNode'
            - $ref: '#/components/schemas/ManualTaskNode'
            - $ref: '#/components/schemas/ReceiveTaskNode'
            - $ref: '#/components/schemas/ScriptTaskNode'
            - $ref: '#/components/schemas/SendTaskNode'
            - $ref: '#/components/schemas/ServiceTaskNode'
            - $ref: '#/components/schemas/SubProcessNode'
            - $ref: '#/components/schemas/TaskNode'
            - $ref: '#/components/schemas/UserTaskNode'
    ReceiveTaskNode:
      allOf:
