// Configure as a library project
apply plugin: 'java-library'
apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

java {
    withSourcesJar()
    withJavadocJar()
}

mavenPublish(project)

dependencies {
    api project(':engine-core')
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    api 'org.springframework.kafka:spring-kafka'
    api 'org.springframework.boot:spring-boot-starter-kafka'

    implementation "software.amazon.msk:aws-msk-iam-auth:2.1.1"
    implementation 'software.amazon.awssdk:sts:2.26.9'

    // for both Kafka and Mongo Encryption and will be injected into engine and orchest client
    api project(':encryption')
}

// Spring Boot BOM manages junit-platform-engine to 6.0.1 but the root build.gradle pins
// junit-platform-launcher to 1.11.0. Force all JUnit platform artifacts to 6.0.1 to align.
configurations.testRuntimeClasspath {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.junit.platform') {
            details.useVersion '6.0.1'
            details.because 'align junit-platform-launcher with junit-platform-engine from Spring Boot BOM'
        }
    }
}

